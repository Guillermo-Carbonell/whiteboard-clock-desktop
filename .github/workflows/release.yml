# Arma el instalador de Windows y lo publica en Releases (de ahí se actualizan solas las apps instaladas).
# Se dispara al subir una etiqueta vX.Y.Z que coincida con la versión de package.json.
name: Instalador de Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # la versión se crea antes en Releases: si no, el instalador y sus archivos chocan al crearla a la vez
      - name: Crear la versión en Releases
        shell: bash
        run: V=v$(node -p "require('./package.json').version"); gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "${V#v}" --notes "Whiteboard Clock para Windows ${V#v}" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Armar y publicar
        shell: bash
        run: npx electron-builder --win --publish always 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # si falla, deja el final del registro en un issue para poder verlo
      - name: Avisar el error
        if: failure()
        shell: bash
        run: tail -60 build.log > tail.txt; gh issue create --title "Falló el instalador (${{ github.ref_name }})" --body-file tail.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
