# Arma el instalador de Windows y lo publica en Releases (de ahí se actualizan solas las apps instaladas).
# Se dispara al subir una etiqueta vX.Y.Z que coincida con la versión de package.json.
name: Instalador de Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
