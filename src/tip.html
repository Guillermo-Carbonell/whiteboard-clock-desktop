<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tooltip</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  /* igual que los tooltips de la página (modo oscuro) */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; pointer-events: none; }
  body { display: flex; justify-content: center; align-items: flex-end; box-sizing: border-box; padding: 4px 12px 10px; }
  body.down { align-items: flex-start; padding: 10px 12px 4px; }
  .b { display: flex; flex-direction: column; gap: 1px; background: #ECEFF1; color: #1B1F22; border-radius: 6px; padding: 8px 10px; font: 12.5px/1.4 'Inter', 'Segoe UI', system-ui, sans-serif; white-space: pre; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); opacity: 0; transform: translateY(3px); transition: opacity .08s, transform .08s; }
  .b.on { opacity: 1; transform: none; }
  .b b { font-weight: 500; font-size: 13px; }
  .b span { color: #455A64; }
</style></head>
<body><div class="b" id="b"></div>
<script>
  const b = document.getElementById('b');
  window.tip.onText((t, down) => {
    document.body.classList.toggle('down', !!down);
    const [first, ...rest] = String(t || '').split('\n');
    b.textContent = '';
    const h = document.createElement(rest.length ? 'b' : 'div'); h.textContent = first; b.appendChild(h);
    for (const l of rest) { const s = document.createElement('span'); s.textContent = l; b.appendChild(s); }
    if (!b.classList.contains('on')) requestAnimationFrame(() => b.classList.add('on'));
  });
  window.tip.onHide?.(() => b.classList.remove('on'));
  window.tip.ready();
</script>
</body></html>
